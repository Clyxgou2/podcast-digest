name: build episodes
on:
  push:
    paths: ["podcast-digest-site/data/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 podcast-digest-site/build.py podcast-digest-site/data --merge
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add podcast-digest-site/episodes.json
          git diff --cached --quiet || git commit -m "Build episodes.json"
          git push
